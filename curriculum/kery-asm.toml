# Kéry & Kellner, Applied Statistical Modelling for Ecologists (2024)
#
# THE CANON. Reviewed, cited, never edited by an agent. See docs/curriculum.md.
#
# The set text for ESPM 215 (Hierarchical Bayes). Imported from the book's own
# Contents PDF rather than from a recalled or web-scraped table of contents --
# which is the strongest verification available here, since the source and the
# thing being cited are the same file.
#
# Granularity is x.y sections. The book also has x.y.z subsections; those are
# deliberately not topics, because 500 nodes would multiply notes without
# improving the coverage audit, and the course plan assigns work by section
# ("Ch. 2.1-2.3"). Page ranges run from a section's start to the page before
# the next one, so a subsection is always inside its parent's range.
#
# Each chapter is a separate PDF, so each has its own page_offset. Offsets are
# computed as 1 - (the chapter's printed start page) and verified against the
# PDFs: chapter 2's pdf page 1 carries printed page 15, chapter 5's carries
# 147. Getting an offset wrong extracts the wrong pages silently, so this is
# measured rather than assumed.

